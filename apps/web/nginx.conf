map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 5m;
  access_log off;
  error_log /var/log/nginx/error.log crit;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  location /api/ { access_log off; proxy_pass http://api:8080; proxy_set_header Host $http_host; }
  location /hubs/ { proxy_pass http://api:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header Host $http_host; proxy_buffering off; proxy_read_timeout 120s; }
  location ~ ^/(sandbox/pay|orders/track)/ { access_log off; try_files $uri $uri/ /index.html; }
  location / { try_files $uri $uri/ /index.html; }
}
